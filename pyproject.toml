[project]
name = "theoretical-saturation-mcp"
version = "0.1.0"
description = "MCP Server para gerenciar a saturação teórica."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "PyYAML>=6.0.2",
]

[project.scripts]
theoretical-saturation-mcp = "theoretical_saturation_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
